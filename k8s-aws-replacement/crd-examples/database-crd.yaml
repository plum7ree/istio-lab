# 더 복잡한 예제: Database CRD
# 실제 Operator에서는 이런 식으로 데이터베이스 같은 복잡한 리소스를 정의합니다

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.example.com
spec:
  group: example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - type
            - version
            properties:
              type:
                type: string
                enum: ["mysql", "postgresql", "mongodb"]
                description: "데이터베이스 타입"
              version:
                type: string
                description: "데이터베이스 버전"
                pattern: '^[0-9]+\.[0-9]+$'
              storage:
                type: object
                properties:
                  size:
                    type: string
                    pattern: '^[0-9]+Gi$'
                    description: "스토리지 크기 (예: 10Gi)"
                  storageClassName:
                    type: string
              replicas:
                type: integer
                minimum: 1
                maximum: 5
                default: 1
              resources:
                type: object
                properties:
                  requests:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                  limits:
                    type: object
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
              backup:
                type: object
                properties:
                  enabled:
                    type: boolean
                  schedule:
                    type: string
                    description: "Cron 표현식 (예: 0 2 * * *)"
              credentials:
                type: object
                properties:
                  secretName:
                    type: string
                    description: "Secret 이름 (username, password 포함)"
          status:
            type: object
            properties:
              phase:
                type: string
                enum: ["Creating", "Running", "BackingUp", "Failed"]
              endpoint:
                type: string
                description: "데이터베이스 접속 엔드포인트"
              readyReplicas:
                type: integer
              lastBackupTime:
                type: string
                format: date-time
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: databases
    singular: database
    kind: Database
    shortNames:
    - db
    categories:
    - all

