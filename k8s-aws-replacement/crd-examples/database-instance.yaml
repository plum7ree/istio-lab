# Database Custom Resource 인스턴스 예제

apiVersion: example.com/v1
kind: Database
metadata:
  name: production-db
  namespace: default
spec:
  type: postgresql
  version: "14.5"
  replicas: 2
  storage:
    size: "100Gi"
    storageClassName: "fast-ssd"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  backup:
    enabled: true
    schedule: "0 2 * * *"  # 매일 새벽 2시
  credentials:
    secretName: db-credentials

