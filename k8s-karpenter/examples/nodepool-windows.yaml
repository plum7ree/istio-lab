# Windows 노드용 NodePool 예시
# Windows 컨테이너를 실행하기 위한 노드 풀

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: windows-nodepool
spec:
  template:
    metadata:
      labels:
        workload-type: windows
        kubernetes.io/os: windows
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: windows-nodeclass  # 별도의 EC2NodeClass 필요
      
      requirements:
        # Windows 지원 인스턴스 타입
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t3.medium
            - t3.large
            - t3.xlarge
            - m5.large
            - m5.xlarge
        
        # Windows OS
        - key: kubernetes.io/os
          operator: In
          values: ["windows"]
        
        # 아키텍처
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        
        # 가용 영역
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-west-2a
            - us-west-2b
            - us-west-2c
        
        # On-demand만 사용 (Windows Spot은 제한적)
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
  
  limits:
    cpu: "200"
    memory: 200Gi
  
  disruption:
    consolidateAfter: 300s  # Windows는 더 긴 대기 시간
    consolidatePolicy: WhenUnderutilized
    expireAfter: 720h
  
  weight: 20  # 낮은 우선순위
