# GPU 워크로드용 NodePool 예시
# GPU 인스턴스를 사용하는 워크로드를 위한 전용 노드 풀

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-nodepool
spec:
  template:
    metadata:
      labels:
        workload-type: gpu
        accelerator: nvidia
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      
      requirements:
        # GPU 인스턴스 타입
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - g4dn.xlarge
            - g4dn.2xlarge
            - g4dn.4xlarge
            - g5.xlarge
            - g5.2xlarge
        
        # 아키텍처
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        
        # 가용 영역
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-west-2a
            - us-west-2b
            - us-west-2c
        
        # Spot 인스턴스 사용 (비용 절감)
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
        
        # GPU 라벨
        - key: karpenter.k8s.aws/instance-gpu-name
          operator: Exists
  
  limits:
    cpu: "2000"
    memory: 2000Gi
  
  disruption:
    consolidateAfter: 30s
    consolidatePolicy: WhenUnderutilized
    expireAfter: 720h
  
  weight: 50  # 기본 노드 풀보다 낮은 우선순위
