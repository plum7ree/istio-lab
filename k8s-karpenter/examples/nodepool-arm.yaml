# ARM 아키텍처용 NodePool 예시
# ARM64 인스턴스를 사용하는 워크로드를 위한 노드 풀

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: arm-nodepool
spec:
  template:
    metadata:
      labels:
        workload-type: arm
        kubernetes.io/arch: arm64
    spec:
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: default
      
      requirements:
        # ARM 인스턴스 타입 (Graviton2/Graviton3)
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            - t4g.medium
            - t4g.large
            - t4g.xlarge
            - m6g.large
            - m6g.xlarge
            - c6g.large
            - c6g.xlarge
        
        # ARM64 아키텍처
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        
        # 가용 영역
        - key: topology.kubernetes.io/zone
          operator: In
          values:
            - us-west-2a
            - us-west-2b
            - us-west-2c
        
        # Spot 인스턴스 사용
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - spot
            - on-demand
  
  limits:
    cpu: "500"
    memory: 500Gi
  
  disruption:
    consolidateAfter: 30s
    consolidatePolicy: WhenUnderutilized
    expireAfter: 720h
  
  weight: 30  # 낮은 우선순위 (특수 용도)
