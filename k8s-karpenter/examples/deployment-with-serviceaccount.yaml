# ServiceAccount와 Pod 연결 예시

# 1. ServiceAccount 생성
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-app
  namespace: default
  annotations:
    # IRSA 사용 시 (EKS)
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/MyAppRole
---
# 2. ClusterRole 생성 (권한 정의)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: my-app-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
# 3. ClusterRoleBinding 생성 (권한 부여)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: my-app-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: my-app-role
subjects:
- kind: ServiceAccount
  name: my-app          # ← ServiceAccount에 권한 부여
  namespace: default
---
# 4. Deployment 생성 (Pod에 ServiceAccount 연결)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      serviceAccountName: my-app  # ← 여기서 ServiceAccount 연결!
      containers:
      - name: my-app
        image: nginx:alpine
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
